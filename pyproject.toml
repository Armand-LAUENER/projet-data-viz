[project]
name = "streamlit-tax-europe"
version = "0.1.0"
description = "Data storytelling dashboard on tax-to-GDP ratios in Europe (Eurostat gov_10a_taxag)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Armand Lauener" }]
dependencies = [
    "streamlit>=1.40,<2.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<6.0",
    "pyarrow>=17.0",
    "eurostat>=1.0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# dict(...) is the idiomatic Plotly layout style used throughout utils/viz.py.
ignore = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
